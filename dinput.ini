
;encoding: UTF-8

;To use DirectInput, you need to disable Steam Input 

;-----------------------------------------------------
;{pov}: P0L P0R P0U P0D to P3L P3R P3U P3D
;  POV directions
;  DIJOYSTATE::rgdwPOV[n]
;
;{button}: B1 to B32
;  32 buttons
;  DIJOYSTATE::rgbButtons[n-1]
;
;{buttons}: {pov} | {button}
;
;{axis}: X | Y | Z | Rx | Ry | Rz | S0 | S1
;  X, Y, Z    DIJOYSTATE::lX,lY,lZ
;  Rx, Ry, Rz DIJOYSTATE::lRx,lRy,lRz
;  S0, S1     DIJOYSTATE::rglSlider[n]
;
;
;{Digital}: [[!]{buttons}+] {buttons} [:{analogValue}]
;  ex: A    =  B4                       ; Press B4
;  ex: HatL =  P0L                      ; PovLeft
;  ex: B    =  B2 + B4                  ; Combination Press B2 and B4
;  ex: X    = !B2 + B4                  ; NotPress B2 and Press B4
;
;  {analogValue}: 1 - 65535
;    ex: RX+ = B3                       ; Rx+ in 1.0
;    ex: RX+ = B3:65535                 ; Rx+ in 1.0
;    ex: RX- = B5:32767                 ; Rx- in 0.49999 ( 32767/65535)
;    ex: RX- = B5:10                    ; Rx- in 0.00015259 ( 10/65535)
;
;
;{Analog}: [[!]{buttons}+] {axis} : {min} : {max}
;
;  {min}: 0 - 65535
;    Minimum input value
;  {max}: 0 - 65535
;    Maximum input value
;
;  ex: RX- = Y  : 34000 : 65000         ; 0-32767-34000(0.0 Deadzone), 34000-65000(0.0-1.0), 65000-65535(1.0 Threshold)
;  ex: LT  = Rz : 40000 : 32767         ; 65535-40000(0.0), 40000-32767(0.0-1.0), 32767-0(1.0)
;  ex: RB  = S1 : 0     : 33000         ; 0-0(0.0), 0-33000(0.0-1.0), 33000-65535(1.0)
;  ex: A   = Rx : 100   : 65535         ; Analog to Digital 0-65534(0.0-0.99997=off), 65535(1.0=on)
;  ex: B   = Ry : 50000 : 10000         ; Analog to Digital 65535-10001(0.0-0.99998=off), 10000-0(1.0=on)
;
;{Ffb}:
;  Sine  : {offset of DIJOYSTATE 0-28}  : {magnitude 1 - 10000} : {period Milliseconds 1-5000}
;  Const : {offset of DIJOYSTATE 0-28}  : {magnitude 1 - 10000}
;  Spring: {offset of DIJOYSTATE 0-28}  : {Saturation 1 - 10000} : {Coefficient -10000 - 10000} : {Offset -10000 - 10000} : {DeadBand 0 - 10000}
;    ex: Sine   : 0 : 10000 : 100       ; SineWave,        lX, MaxPowr100%, 100ms=10Hz      Oscillation
;    ex: Const  : 4 : 5000              ; ConstantForce,   lY, HalfPowr50%                  Rumble
;    ex: Spring : 0 : 3000 : 2000 :0:0  ; Centering force, lX, Sat30%, Cf20%, Ofs0, DB0     Centering
;-----------------------------------------------------



;-----------------------------------------------------
;[(VID:X4)(PID:X4)]                     ; Device Section Start
;Name = Display Name                    ; (optional)
;
;LX-  = {Analog} | {Digital}            ; left
;LX+  =                                 ; right
;LY-  =                                 ; up
;LY+  =                                 ; down
;RX-  =
;RX+  =
;RY-  =
;RY+  =
;
;LT   = {Analog} | {Digital}            ; Analog possible
;RT   =
;
;LB   = {Analog} | {Digital}            ; Analog possible
;RB   =
;
;A    = {Analog} | {Digital}            ; Digital Buttons
;B    =
;X    =
;Y    =
;LSC  =                                 ; StickClick L3
;RSC  =                                 ; StickClick R3
;Menu =
;View =
;HatL =                                 ; D-pad
;HatR =                                 ; D-pad
;HatU =                                 ; D-pad
;HatD =                                 ; D-pad
;
;FFB  = {Ffb}                           ; Force Feedback Setting
;SpecialMode = TM                       ; Vibration support for Thrustmaster devices
;-----------------------------------------------------




[0]                         ; 0 = default
HatL= P0L
HatR= P0R
HatU= P0U
HatD= P0D
LX-=  X:32000:16            ; 0x7d00-0x0010
LX+=  X:33536:65520         ; 0x8300-0xfff0
LY-=  Y:32000:16            ; 0x7d00-0x0010
LY+=  Y:33536:65520         ; 0x8300-0xfff0
RX-=  Z:32000:16            ; 0x7d00-0x0010
RX+=  Z:33536:65520         ; 0x8300-0xfff0
RY-=  Rz:32000:16           ; 0x7d00-0x0010
RY+=  Rz:33536:65520        ; 0x8300-0xfff0
LT=   Rx:16:65520           ; 0x0010-0xfff0
RT=   Ry:16:65520           ; 0x0010-0xfff0
LB=   B5
RB=   B6
A=    B2
B=    B3
X=    B1
Y=    B4
LSC=  B11
RSC=  B12
Menu= B10
View= B9
FFB=  Sine :0:10000:100     ; 1st try lX   SineWave,      lX, MaxPowr(10000), 100ms
FFB=  Const:0:10000         ; 2nd try lX   ConstantForce, lX, MaxPowr(10000)
FFB=  Sine :4:10000:100     ; 1st try lY   SineWave,      lY, MaxPowr(10000), 100ms
FFB=  Const:4:10000         ; 2nd try lY   ConstantForce, lY, MaxPowr(10000)


