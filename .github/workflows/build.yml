name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, check and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Keep release archives
        uses: actions/upload-artifact@v4
        with:
          name: ACZeroPCremap-release
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Keep UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-previews
          path: artifacts/ui-checks/*.png
          if-no-files-found: ignore
